# ============================================================
# ResearchMate AI — GitHub Actions CI/CD
# ============================================================
# Runs on every push and pull-request that touches the backend.
# Steps:
#   1. Checkout code
#   2. Set up Python
#   3. Install dependencies
#   4. Lint with flake8
#   5. Run backend pytest suite
# ============================================================

name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------------
      # 1. Check out the repository
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # 2. Set up Python
      # --------------------------------------------------------
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      # --------------------------------------------------------
      # 3. Install dependencies
      # --------------------------------------------------------
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --------------------------------------------------------
      # 4. Lint — warn only, do not fail the build on style issues
      # --------------------------------------------------------
      - name: Lint with flake8
        working-directory: backend
        run: |
          pip install flake8
          # Stop on syntax errors or undefined names; warn on style
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app/ --count --exit-zero --max-line-length=100 --statistics
        continue-on-error: false

      # --------------------------------------------------------
      # 5. Run pytest
      # --------------------------------------------------------
      - name: Run tests
        working-directory: backend
        env:
          MOCK_SEMANTIC_SCHOLAR: "true"
          LLM_API_KEY: "ci-dummy-key"
          DATABASE_URL: "sqlite:///./test_researchmate.db"
        run: |
          python -m pytest tests/ -v --tb=short
